<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FOLD — film</title>
    <script>
      // Seed every random number in the film: identical frames on every render.
      (function () {
        let s = 0x5eed1234;
        Math.random = function () {
          s |= 0; s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      })();
    </script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1024; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      canvas { display: block; }
      .type { position: absolute; left: 0; right: 0; text-align: center; color: #fbf3e4;
        font-family: 'Fraunces Variable', Georgia, serif; font-weight: 560; letter-spacing: 0.01em;
        will-change: transform, opacity, clip-path, filter; pointer-events: none; }
      .type span.plate { display: inline-block; padding: 18px 44px 22px; border-radius: 999px;
        background: radial-gradient(closest-side, rgba(8,10,26,0.62), rgba(8,10,26,0.0)); }
      #end { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: #2b2118; }
      #end .bg { position: absolute; inset: 0; background-size: cover; }
      #end .sweep { position: absolute; inset: 0; mix-blend-mode: soft-light; }
      #end .mark { position: relative; width: 230px; height: 230px; transform-origin: 50% 70%; }
      #end .word { position: relative; font-family: 'Fraunces Variable', Georgia, serif; font-weight: 650;
        font-size: 178px; letter-spacing: 0.16em; line-height: 1; margin: 6px 0 0 0.16em; color: #2b2118; }
      #end .tag { position: relative; font-family: 'Fraunces Variable', Georgia, serif; font-style: italic;
        font-size: 42px; color: #b8452c; margin-top: 18px; }
      #end .made { position: relative; display: flex; align-items: center; gap: 18px; margin-top: 46px;
        font-family: 'Inter Variable', system-ui, sans-serif; font-weight: 560; font-size: 30px; color: #3a2e25; }
      #end .made img { height: 40px; }
      #end .url { position: relative; margin-top: 26px; font-family: 'Inter Variable', system-ui, sans-serif;
        font-weight: 650; font-size: 30px; color: #fff6ea; background: #d9603f; padding: 14px 34px; border-radius: 999px; }
      #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 50% 46%, #fff7e6 0%, #ffd9a0 30%, rgba(255,170,90,0.0) 70%); }
      .tilt { position: absolute; left: 0; right: 0; height: 34%; pointer-events: none; backdrop-filter: blur(var(--b, 0px)); -webkit-backdrop-filter: blur(var(--b, 0px)); }
      #tiltTop { top: 0; -webkit-mask-image: linear-gradient(#000 20%, transparent); mask-image: linear-gradient(#000 20%, transparent); }
      #tiltBot { bottom: 0; -webkit-mask-image: linear-gradient(transparent, #000 80%); mask-image: linear-gradient(transparent, #000 80%); }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 55%, rgba(4,6,18,0.42) 100%); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="tiltTop" class="tilt"></div>
    <div id="tiltBot" class="tilt"></div>
    <div id="vignette"></div>
    <div id="types"></div>
    <div id="flash"></div>
    <div id="end">
      <div class="bg"></div>
      <div class="sweep"></div>
      <svg class="mark" viewBox="0 0 100 100"></svg>
      <div class="word">FOLD</div>
      <div class="tag">a little paper world, folded by hand</div>
      <div class="made"><img id="meta-logo" alt="" style="display:none" /><span>Made for Meta Quest &amp; Meta VR Glasses</span></div>
      <div class="url">fold-blond.vercel.app</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
